<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>코드 맵 · 화살표만 따라가기</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <div class="map-wrap">
        <svg
          id="map"
          viewBox="-400 -400 800 800"
          role="group"
          aria-label="화살표를 따라 선택하는 코드 맵"
        ></svg>
      </div>
      <div id="chips" class="chips" aria-label="만든 코드 진행"></div>
      <div class="caption" id="caption" aria-live="polite"></div>
      <div id="candidates" class="candidates" aria-label="다음 코드 후보"></div>
      <div class="toolbar">
        <button id="play" class="primary">▶ 재생</button
        ><button id="loop" aria-pressed="false">반복</button
        ><button id="walk">자동 산책</button><button id="undo">되돌리기</button
        ><button id="clear">비우기</button><button id="demo">데모 보기</button
        >
      </div>
      <details class="settings" open>
        <summary>맵과 사운드 설정</summary>
        <div class="controls">
          <label
            ><input id="strict" type="checkbox" checked />화살표만 허용</label
          ><label
            >12시 코드
            <select id="rotation"></select
          ></label>
          <label
            >BPM
            <input
              id="bpm"
              type="number"
              min="40"
              max="200"
              value="90" /></label
          ><label
            >코드당 박
            <select id="beats">
              <option value="1">1박</option>
              <option value="2" selected>2박</option>
              <option value="4">4박</option>
              <option value="8">8박</option>
            </select></label
          >
          <label
            >음색
            <select id="timbre">
              <option value="piano">피아노풍</option>
              <option value="pad">패드</option>
              <option value="pluck">플럭</option>
            </select></label
          ><label
            >리듬
            <select id="rhythm">
              <option value="block">블록</option>
              <option value="arpeggio">아르페지오</option>
              <option value="strum">스트럼</option>
            </select></label
          >
        </div>
        <fieldset>
          <legend>화살표 표시 · 선의 명도로 구분</legend>
          <label><input type="checkbox" id="legend" checked />범례</label
          ><label
            ><input type="checkbox" data-edge="dominant" checked />도미넌트
            경로</label
          ><label
            ><input type="checkbox" data-edge="ring" checked />이웃 이동</label
          ><label
            ><input type="checkbox" data-edge="passing" checked />경과
            감7</label
          >
          <div id="legend-text">
            실선: 도미넌트　점선: 이웃　촘촘한 점선: 감7
          </div>
        </fieldset>
        <fieldset>
          <legend>추가 화성</legend>
          <label><input id="tritone" type="checkbox" />트라이톤 대리</label
          ><label><input id="backdoor" type="checkbox" />백도어</label
          ><label><input id="iiV" type="checkbox" />ii–V 묶음</label>
        </fieldset>
      </details>
      <details class="settings">
        <summary>저장 · 공유 · 외부 건반</summary>
        <div class="controls">
          <label
            >진행 이름
            <input
              id="save-name"
              maxlength="80"
              placeholder="나의 첫 진행" /></label
          ><button id="save">저장</button
          ><label
            >저장한 진행
            <select id="saved">
              <option value="">진행 선택</option>
            </select></label
          ><button id="load">불러오기</button
          ><button id="delete">선택 삭제</button
          ><button id="share">URL 공유</button><button id="export">JSON</button
          ><button id="midi-export">MIDI 파일</button
          ><button id="png">PNG 1080×1920</button
          ><button id="midi">MIDI 건반 연결</button
          ><button id="serial">아두이노 연결</button>
        </div>
      </details>
      <p id="status" role="status"></p>
      <p class="keys">
        ← → 후보 선택 · Enter 추가 · Space 재생 · Backspace 되돌리기<br />맵의
        빈 곳을 드래그하면 회전합니다. 모바일에서는 맵을 좌우로 스크롤할 수
        있어요.
      </p>
    </main>
    <div id="tooltip" role="tooltip" hidden></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
